lid:
  min_confidence: 0.80

filters:
  min_chars: 200
  max_url_ratio: 0.20
  max_repeat_line_ratio: 0.30
  min_alpha_ratio: 0.70

sharding:
  target_compressed_mb: 200
  local_dir: "outputs/shards"

s3:
  bucket: ""
  prefix: "bwiza/cc/v1/"

cc:
  crawl: "CC-MAIN-2025-01"
  wet_paths_file: "configs/wet_sample_urls.txt"
  max_wet_files: 10
  user_agent: "bwiza-data/0.1"
  request_timeout_s: 60
  max_retries: 5
  retry_backoff_s: 2

output:
  local_dir: "outputs/cc"
  shard_prefix: "cc_mvp"
  max_docs_per_run: 0

logging:
  level: "INFO"
