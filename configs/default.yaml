lid:
  min_confidence: 0.80

filters:
  min_chars: 200
  max_url_ratio: 0.20
  max_repeat_line_ratio: 0.30
  min_alpha_ratio: 0.70
  max_chars: 100000
  min_words: 30
  max_word_ngram_rep_2: 0.30
  max_word_ngram_rep_3: 0.25
  max_word_ngram_rep_4: 0.20
  max_non_latin_alpha_ratio: 0.10

sharding:
  enabled: true
  compression: "zstd"
  target_compressed_mb: 200
  local_dir: "outputs/shards"
  filename_prefix: "bwiza"
  flush_every_n: 500

s3:
  enabled: false
  bucket: ""
  prefix: "bwiza/cc/v1/"
  region: ""
  profile: ""
  endpoint_url: ""
  multipart_threshold_mb: 64
  multipart_chunk_mb: 16
  max_retries: 8
  retry_backoff_s: 2
  verify_after_upload: true
  keep_local_after_upload: true
  upload_manifests: true
  upload_stats: true

cc:
  crawl: "CC-MAIN-2026-04"
  wet_paths_file: "configs/wet_sample_urls.txt"
  max_wet_files: 50
  user_agent: "bwiza-data/0.1"
  request_timeout_s: 60
  max_retries: 5
  retry_backoff_s: 2

output:
  local_dir: "outputs/cc"
  shard_prefix: "cc_mvp"
  max_docs_per_run: 0

targeted:
  enabled: false
  seeds_file: "configs/targeted_domains.txt"
  max_pages: 50000
  per_domain_max_pages: 5000
  concurrency: 24
  request_timeout_s: 15
  max_retries: 5
  retry_backoff_s: 2
  user_agent: "bwiza-data/0.1"
  obey_robots_txt: true
  crawl_delay_s: 0.5
  max_response_bytes: 8000000
  allowed_content_types: ["text/html", "application/pdf"]
  output_source: "targeted_web"
  pdf_max_pages: 500
  pdf_min_text_ratio: 0.10

parallel:
  enabled: false
  seeds_file: "configs/parallel_seeds.txt"
  max_pages: 20000
  per_domain_max_pages: 5000
  concurrency: 8
  request_timeout_s: 30
  max_retries: 5
  retry_backoff_s: 2
  obey_robots_txt: true
  crawl_delay_s: 1.0
  max_response_bytes: 8000000
  extract_mode: "page_pairs"
  min_chars: 120
  min_lid_conf: 0.85
  output_source: "parallel_web"

instructions:
  enabled: false
  seed_file: "configs/instruction_seeds.jsonl"
  output_source: "instructions_rw"
  min_chars_prompt: 4
  min_chars_response: 8
  max_chars_prompt: 4000
  max_chars_response: 8000
  allow_english_ratio: 0.05
  target_count: 20000

wiki:
  enabled: false
  dump_url: "https://dumps.wikimedia.org/rwwiki/latest/rwwiki-latest-pages-articles.xml.bz2"
  output_dir: "outputs/wiki"
  output_source: "wikipedia"
  max_articles: 0

dataset_import:
  enabled: false
  output_dir: "outputs/dataset_import"

cc_index:
  enabled: false
  crawls: []
  discover_crawls: true
  min_crawl_date: "2013-01"
  max_crawl_date: ""
  max_crawls: 50
  domain_queries: ["*.rw/*"]
  extra_domain_queries:
    - "*.igihe.com/*"
    - "*.inyarwanda.com/*"
    - "*.kigalitoday.com/*"
    - "*.intyoza.com/*"
    - "*.umuseke.rw/*"
    - "*.ktpress.rw/*"
    - "*.newtimes.co.rw/*"
  cdx_page_size: 50
  cdx_timeout_s: 30
  cdx_max_retries: 3
  cdx_retry_backoff_s: 2
  cdx_rate_limit_s: 0.5
  warc_concurrency: 16
  warc_timeout_s: 30
  warc_max_retries: 3
  warc_retry_backoff_s: 2
  max_records: 0
  output_source: "cc_index"
  user_agent: "bwiza-data/0.1"
  status_filter: ["200"]
  mime_filter: ["text/html"]

wayback:
  enabled: false
  domains:
    - "igihe.com"
    - "umuseke.rw"
    - "ktpress.rw"
    - "newtimes.co.rw"
    - "kigalitoday.com"
    - "inyarwanda.com"
  from_year: 2015
  to_year: 2025
  cdx_timeout_s: 120
  cdx_max_retries: 5
  cdx_retry_backoff_s: 10
  cdx_rate_limit_s: 1.0
  fetch_concurrency: 1
  fetch_timeout_s: 30
  fetch_rate_limit_s: 2.0
  fetch_max_retries: 5
  fetch_retry_backoff_s: 5
  max_records: 5000
  output_source: "wayback"
  user_agent: "bwiza-data/0.1 (kinyarwanda-corpus)"
  status_filter: ["200"]
  mime_filter: ["text/html"]

dedup:
  store_path: "outputs/dedup_store.db"
  fuzzy_threshold: 0.8
  fuzzy_num_perm: 128
  enable_fuzzy: true

logging:
  level: "INFO"
