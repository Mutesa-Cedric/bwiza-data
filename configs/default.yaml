lid:
  min_confidence: 0.80

filters:
  min_chars: 200
  max_url_ratio: 0.20
  max_repeat_line_ratio: 0.30
  min_alpha_ratio: 0.70

sharding:
  enabled: true
  compression: "zstd"
  target_compressed_mb: 200
  local_dir: "outputs/shards"
  filename_prefix: "bwiza"
  flush_every_n: 500

s3:
  enabled: false
  bucket: ""
  prefix: "bwiza/cc/v1/"
  region: ""
  profile: ""
  endpoint_url: ""
  multipart_threshold_mb: 64
  multipart_chunk_mb: 16
  max_retries: 8
  retry_backoff_s: 2
  verify_after_upload: true
  keep_local_after_upload: true
  upload_manifests: true
  upload_stats: true

cc:
  crawl: "CC-MAIN-2026-04"
  wet_paths_file: "configs/wet_sample_urls.txt"
  max_wet_files: 50
  user_agent: "bwiza-data/0.1"
  request_timeout_s: 60
  max_retries: 5
  retry_backoff_s: 2

output:
  local_dir: "outputs/cc"
  shard_prefix: "cc_mvp"
  max_docs_per_run: 0

targeted:
  enabled: false
  seeds_file: "configs/targeted_domains.txt"
  max_pages: 20000
  per_domain_max_pages: 5000
  concurrency: 8
  request_timeout_s: 30
  max_retries: 5
  retry_backoff_s: 2
  user_agent: "bwiza-data/0.1"
  obey_robots_txt: true
  crawl_delay_s: 1.0
  max_response_bytes: 8000000
  allowed_content_types: ["text/html"]
  output_source: "targeted_web"

logging:
  level: "INFO"
