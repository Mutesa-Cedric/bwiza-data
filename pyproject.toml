[project]
name = "bwiza-data"
version = "0.1.0"
description = "Kinyarwanda data factory for AI Bwiza"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "zstandard>=0.22",
    "orjson>=3.9",
    "boto3>=1.34",
    "fasttext-wheel>=0.9",
    "huggingface_hub>=0.20",
    "trafilatura>=1.6",
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["apps", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
