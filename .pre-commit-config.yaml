repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]

      - id: ruff-lint
        name: ruff lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: .venv/bin/pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
